<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonelink Remote Viewer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            background: #070B19;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #login-container {
            background: #0D1527;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1E2C4B;
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #121D33;
            border: 1px solid #00E5FF;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00E5FF;
            color: #070B19;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        #video-container {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #status {
            margin-top: 10px;
            color: #00F59B;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="login-container">
        <h2>Phonelink Viewer</h2>
        <input type="text" id="roomIdInput" placeholder="Enter Device ID (Room ID)">
        <input type="password" id="pinInput" placeholder="Enter Security PIN">
        <button id="connectBtn">Connect to Phone</button>
        <div id="status"></div>
    </div>

    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const socket = io({
            auth: { token: "PHONELINK_SECURE_SECRET_TOKEN_2026" }
        });
        let pc = null;

        const loginContainer = document.getElementById('login-container');
        const videoContainer = document.getElementById('video-container');
        const remoteVideo = document.getElementById('remoteVideo');
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        connectBtn.onclick = () => {
            const roomId = document.getElementById('roomIdInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();

            if (!roomId || !pin) {
                statusDiv.innerText = "Please enter both Room ID and PIN";
                statusDiv.style.color = "#FF5252";
                return;
            }

            statusDiv.innerText = "Connecting...";
            statusDiv.style.color = "#00E5FF";

            socket.emit('join-room', { roomId, pin });
        };

        socket.on('error-msg', (msg) => {
            statusDiv.innerText = msg;
            statusDiv.style.color = "#FF5252";
        });

        socket.on('joined-success', () => {
            statusDiv.innerText = "Authenticated! Waiting for stream...";
        });

        socket.on('offer', async (offer) => {
            loginContainer.style.display = 'none';
            videoContainer.style.display = 'block';

            pc = new RTCPeerConnection(rtcConfig);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };

            pc.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            socket.emit('answer', answer);
        });

        socket.on('ice-candidate', async (candidate) => {
            if (pc) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding received ice candidate', e);
                }
            }
        });

        let downX = 0, downY = 0, downTime = 0;

        remoteVideo.addEventListener('pointerdown', (e) => {
            const rect = remoteVideo.getBoundingClientRect();
            downX = e.clientX - rect.left;
            downY = e.clientY - rect.top;
            downTime = Date.now();
        });

        remoteVideo.addEventListener('pointerup', (e) => {
            const rect = remoteVideo.getBoundingClientRect();
            const upX = e.clientX - rect.left;
            const upY = e.clientY - rect.top;
            const duration = Date.now() - downTime;
            const distance = Math.hypot(upX - downX, upY - downY);

            const width = remoteVideo.clientWidth;
            const height = remoteVideo.clientHeight;

            if (distance < 25) {
                socket.emit('remote-gesture', {
                    type: 'tap',
                    x: upX / width,
                    y: upY / height
                });
            } else {
                socket.emit('remote-gesture', {
                    type: 'swipe',
                    x1: downX / width,
                    y1: downY / height,
                    x2: upX / width,
                    y2: upY / height,
                    duration: duration
                });
            }
        });
    </script>
</body>
</html>
