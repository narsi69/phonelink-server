<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneLink Remote Console</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0B132B 0%, #070B19 100%);
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .login-card {
            background: #0F182E;
            padding: 36px 30px;
            border-radius: 20px;
            border: 1.5px solid #1E2C4B;
            width: 340px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        }
        .brand-title {
            margin: 0 0 6px 0;
            color: #00E5FF;
            font-size: 22px;
            letter-spacing: 1.5px;
            font-weight: 800;
        }
        .brand-sub {
            margin: 0 0 24px 0;
            color: #8696B2;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 12px;
            border: 1.5px solid #1E2C4B;
            background: #070B19;
            color: #00E5FF;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #00E5FF;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
        }
        input::placeholder {
            color: #475569;
            letter-spacing: 1px;
            font-size: 12px;
            font-weight: normal;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00E5FF;
            color: #070B19;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        #errorMsg {
            color: #FF4D6D;
            font-size: 12px;
            margin-top: 14px;
            min-height: 18px;
            font-weight: 600;
        }
        #videoContainer {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            cursor: pointer;
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginCard">
        <div class="brand-title">PHONELINK</div>
        <div class="brand-sub">Secure WebRTC Terminal</div>

        <input type="text" id="inputRoomId" placeholder="6-DIGIT DEVICE ID" maxlength="6">
        <input type="password" id="inputPin" placeholder="4-DIGIT PIN" maxlength="4">

        <button onclick="authenticateSession()">CONNECT DEVICE</button>
        <div id="errorMsg"></div>
    </div>

    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        // Automatic server connection
        const socket = io();
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function authenticateSession() {
            const roomId = document.getElementById('inputRoomId').value.trim();
            const pin = document.getElementById('inputPin').value.trim();
            const errorBox = document.getElementById('errorMsg');

            if (roomId.length < 6 || pin.length < 4) {
                errorBox.style.color = "#FF4D6D";
                errorBox.innerText = "Device ID (6 digit) aur PIN (4 digit) enter karein.";
                return;
            }

            errorBox.style.color = "#00E5FF";
            errorBox.innerText = "Authenticating credentials...";

            socket.emit('join-viewer', { roomId, pin });
        }

        socket.on('auth-error', (data) => {
            const errorBox = document.getElementById('errorMsg');
            errorBox.style.color = "#FF4D6D";
            errorBox.innerText = data.message;
        });

        socket.on('auth-success', () => {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            setupWebRTC();
        });

        function setupWebRTC() {
            peerConnection = new RTCPeerConnection(config);

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };

            socket.on('offer', async (offer) => {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('answer', answer);
            });

            socket.on('ice-candidate', (candidate) => {
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });

            // Remote click forwarding
            const video = document.getElementById('remoteVideo');
            video.addEventListener('click', (e) => {
                const rect = video.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                socket.emit('remote-gesture', { type: 'TAP', x, y });
            });
        }
    </script>
</body>
</html>
